{% extends "base.html" %}

{% block title %}User Login - ProphetAI{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="glass-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="logo-icon" style="margin: 0 auto 1rem; width: 50px; height: 50px; font-size: 1.6rem; background: var(--gradient-primary); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: #000;">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <h2 style="font-family: var(--font-heading); font-size: 1.8rem; font-weight: 700;">Welcome Back</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.4rem;">Sign in to access your ML workspace</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="username_or_email">Username or Email</label>
                <input type="text" id="username_or_email" name="username_or_email" class="form-control" placeholder="Enter username or email" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
                <i class="fa-solid fa-lock-open"></i> Log In
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--accent-emerald); font-weight: 600;">Register Now</a>
        </div>
    </div>
</div>
{% endblock %}
